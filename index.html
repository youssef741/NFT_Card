<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <article class="card">
      <div class="card-image">
        <img
          class="equilibrium"
          src="./images/image-equilibrium.jpg"
          alt="equilibrium"
        />
        <div class="overlay">
          <img src="./images/icon-view.svg" alt="icon-view" />
        </div>
      </div>

      <div class="content">
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="coins">
          <span>
            <img src="./images/icon-ethereum.svg" alt="ethereum" /> 0.041 Gold
          </span>
          <span>
            <img src="./images/icon-clock.svg" alt="clock" /> 3 days left
          </span>
        </div>
        <hr />
        <div class="creater">
          <img class="avater" src="./images/image-avatar.png" alt="avater" />
          <p>Creation of <span>Jules Wyvern</span></p>
        </div>
      </div>
    </article>
  </body>
  <script type="module" defer src="/src/main.js"></script>
</html>
